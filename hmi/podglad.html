<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Podajnik arkuszy</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    background: #e4ddd2;
    color: #1c1a17;
    font-family: "Segoe UI", sans-serif;
  }
  main { max-width: 980px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; font-weight: 650; margin: 0 0 4px; }
  p.lead { margin: 0 0 16px; color: #5c564c; }
  .stage {
    background: #2a2724;
    border-radius: 18px;
    padding: 14px;
  }
  svg { width: 100%; height: auto; display: block; background: #f7f4ee; border-radius: 10px 10px 0 0; }
  .bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
    align-items: center;
    padding: 12px 12px 14px;
    font-variant-numeric: tabular-nums;
    background: #f7f4ee;
    border-radius: 0 0 10px 10px;
  }
  .actions { display: flex; gap: 8px; width: 100%; }
  .state {
    font-family: Consolas, monospace;
    font-weight: 700;
    letter-spacing: 0.04em;
    min-width: 7.5em;
  }
  #alarm { color: #5c564c; }
  button {
    background: #1c1a17;
    color: #f7f4ee;
    border: 0;
    border-radius: 8px;
    padding: 8px 14px;
    font: inherit;
    cursor: pointer;
  }
  button.ghost { background: transparent; color: #1c1a17; border: 1px solid #1c1a17; }
  .lamp { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: -1px; background: #c8c0b4; }
  .lamp.on-run { background: #2f7d4a; }
  .lamp.on-fault { background: #a33b24; }
</style>
</head>
<body>
<main>
  <h1>Podajnik arkuszy</h1>
  <p class="lead">Start puszcza arkusz dopiero, gdy rolka dojdzie do 70 °C. Powyżej 95 °C grzałka odpada.</p>
  <div class="stage">
    <svg viewBox="0 0 860 250" id="drawing">
      <line x1="70" y1="170" x2="790" y2="170" stroke="#1c1a17" stroke-width="8"/>
      <line x1="70" y1="170" x2="70" y2="210" stroke="#1c1a17" stroke-width="8"/>
      <line x1="790" y1="170" x2="790" y2="210" stroke="#1c1a17" stroke-width="8"/>
      <circle cx="230" cy="150" r="36" fill="#f7f4ee" stroke="#1c1a17" stroke-width="4"/>
      <circle cx="560" cy="150" r="36" fill="#f7f4ee" stroke="#1c1a17" stroke-width="4"/>
      <rect id="sheet" x="120" y="122" width="78" height="22" rx="2" fill="#e7c27a" stroke="#8a3b12" stroke-width="2" visibility="hidden"/>
      <g id="sEntry"></g>
      <g id="sReg"></g>
      <g id="sExit"></g>
    </svg>
    <div class="bar">
      <span class="state" id="state">ESTOP</span>
      <span id="alarm">Obwód otwarty. Zamknij i kasuj.</span>
      <span><i class="lamp" id="lampRun"></i>praca</span>
      <span><i class="lamp" id="lampFault"></i>awaria</span>
      <span id="stats">arkusze 0 · grzałka 0%</span>
      <span class="actions">
        <button type="button" id="btnEstop" class="ghost">E-stop</button>
        <button type="button" id="btnCover" class="ghost">Pokrywa</button>
        <button type="button" id="btnReset" class="ghost">Reset</button>
        <button type="button" id="btnStart">Start</button>
        <button type="button" id="btnStop" class="ghost">Stop</button>
        <button type="button" id="btnJam" class="ghost">Zacięcie</button>
        <button type="button" id="btnHot" class="ghost">Za gorąco</button>
      </span>
    </div>
  </div>
</main>
<script>
const NAMES = {1:"READY",2:"FEED",3:"REGISTER",4:"RUN",5:"JAM",6:"FAULT",7:"ESTOP",8:"COVER"};
const ALARM = {
  READY: "Gotowy. Start podaje arkusz.",
  FEED: "Sprzeglo podaje.",
  REGISTER: "Czekam na rejestracje, limit 800 ms.",
  RUN: "Arkusz jedzie do wyjscia.",
  JAM: "Zaciecie. Zdejmij arkusz, potem kasuj.",
  FAULT: "Awaria napedu.",
  ESTOP: "Obwod otwarty. Zamknij i kasuj.",
  COVER: "Pokrywa otwarta."
};
const sensors = [
  { id: "sEntry", x: 214, at: 230, label: "wejście" },
  { id: "sReg", x: 392, at: 408, label: "rejestracja", accent: true },
  { id: "sExit", x: 544, at: 560, label: "wyjście" }
];
for (const s of sensors) {
  const g = document.getElementById(s.id);
  const color = s.accent ? "#8a3b12" : "#1c1a17";
  g.innerHTML = `
    <rect x="${s.x}" y="78" width="32" height="28" fill="#f7f4ee" stroke="${color}" stroke-width="3"/>
    <circle class="dot" cx="${s.x + 16}" cy="92" r="5" fill="#c8c0b4"/>
    <text x="${s.x - 8}" y="68" font-family="Consolas, monospace" font-size="13" fill="${color}">${s.label}</text>`;
}

const sheet = document.getElementById("sheet");
const stateEl = document.getElementById("state");
const lampRun = document.getElementById("lampRun");
const lampFault = document.getElementById("lampFault");
const stats = document.getElementById("stats");

function Feeder() {
  this.needReset = true;
  this.runEnable = false;
  this.runRequest = false;
  this.jam = false;
  this.phase = 0;
  this.timer = 0;
  this.sheets = 0;
  this.fault = false;
  this.prev = {};
  this.heat = 0;
  this.heatArmed = false;
  this.motor = false;
  this.clutch = false;
  this.gate = false;
  this.busy = false;
  this.state = 7;
}
Feeder.prototype.rise = function (name, value) {
  const prev = !!this.prev[name];
  this.prev[name] = !!value;
  return !!value && !prev;
};
Feeder.prototype.step = function (inp) {
  const rReset = this.rise("reset", inp.reset);
  const rStart = this.rise("start", inp.start);
  const rStop = this.rise("stop", inp.stop);
  const rEntry = this.rise("entry", inp.sensEntry);
  const rExit = this.rise("exit", inp.sensExit);
  const path = inp.sensEntry || inp.sensRegister || inp.sensExit;

  if (!inp.estopOk) { this.needReset = true; this.runEnable = false; }
  else if (this.needReset) { this.runEnable = false; if (rReset) { this.needReset = false; this.runEnable = true; } }
  else this.runEnable = true;

  if (inp.motorFault) this.fault = true;
  if (rReset && !inp.motorFault) this.fault = false;
  if (rReset && this.jam && !path) { this.jam = false; this.phase = 0; this.timer = 0; }
  if (rStop || !this.runEnable || inp.motorFault || !inp.coverClosed) this.runRequest = false;

  const ready = inp.temp >= 70 && inp.temp <= 95;
  this.overtemp = inp.temp > 95 && this.runEnable && inp.coverClosed;
  this.warmReady = ready && this.runEnable && inp.coverClosed;
  const motion = this.runEnable && inp.coverClosed && !this.fault && !this.jam && !this.overtemp;
  if (rStart && motion && !this.busy && this.warmReady) this.runRequest = true;
  const feed = this.runRequest && motion;
  this.track(feed, inp, rEntry, rExit, path);

  this.motor = this.motor && motion && !this.jam;
  if (this.jam || !motion) { this.clutch = false; this.gate = false; }

  if (!(this.runEnable && inp.coverClosed && !this.jam && !this.fault) || this.overtemp) this.heat = 0;
  else this.heat = 100;

  this.busy = this.jam || this.phase !== 0 || this.clutch;
  this.state = !this.runEnable ? 7 : (this.fault || this.overtemp) ? 6 : this.jam ? 5 : !inp.coverClosed ? 8
    : this.phase === 1 ? 3 : (this.phase === 2 || this.phase === 3) ? 4 : this.clutch ? 2 : 1;
};
Feeder.prototype.track = function (feed, inp, rEntry, rExit, path) {
  if (this.jam) { this.motor = false; this.clutch = false; this.gate = false; this.timer = 0; return; }
  if (!feed && this.phase !== 0) {
    if (path) this.jam = true;
    else { this.phase = 0; this.timer = 0; }
    this.motor = false; this.clutch = false; this.gate = false;
    return;
  }
  if (this.phase === 0) {
    this.gate = false; this.timer = 0;
    if (feed && rEntry) { this.clutch = false; this.motor = true; this.phase = 1; }
    else if (feed && path) { this.jam = true; this.clutch = false; this.motor = false; }
    else if (feed) { this.clutch = true; this.motor = true; }
    else { this.clutch = false; this.motor = false; }
  } else if (this.phase === 1) {
    this.clutch = false; this.motor = true; this.gate = false;
    this.timer += 10;
    if (inp.sensRegister) { this.phase = 2; this.timer = 0; this.gate = true; }
    else if (this.timer >= 800) { this.jam = true; this.phase = 0; this.motor = false; }
  } else if (this.phase === 2) {
    this.clutch = false; this.motor = true; this.gate = true;
    this.timer += 10;
    if (rExit) { this.sheets += 1; this.phase = 3; this.timer = 0; this.gate = false; }
    else if (this.timer >= 800) { this.jam = true; this.phase = 0; this.motor = false; this.gate = false; }
  } else {
    this.clutch = false; this.gate = false; this.motor = true;
    if (!path) { this.phase = 0; this.motor = false; }
  }
  if (this.jam) { this.motor = false; this.clutch = false; this.gate = false; }
};

const machine = new Feeder();
let sheetX = null;
let blockReg = false;
let pulse = { start: false, stop: false, reset: false };
let temp = 25;
let forceHot = false;
let coverClosed = true;

function hits(center) {
  if (sheetX == null) return false;
  return Math.abs(sheetX + 39 - center) < 42;
}

function paint() {
  machine.lampFault = machine.jam || machine.fault || machine.overtemp || !machine.runEnable;
  const name = NAMES[machine.state];
  stateEl.textContent = name;
  let alarm = ALARM[name];
  if (name === "READY" && !machine.warmReady) alarm = "Rolka " + Math.round(temp) + " C. Start po 70 C.";
  if (machine.overtemp) alarm = "Przegrzanie. Grzalka odpada powyzej 95 C.";
  document.getElementById("alarm").textContent = alarm;
  stateEl.style.color = (name === "JAM" || name === "ESTOP" || name === "FAULT") ? "#a33b24" : "#1c1a17";
  lampRun.className = "lamp" + (machine.motor ? " on-run" : "");
  lampFault.className = "lamp" + (machine.lampFault ? " on-fault" : "");
  stats.textContent = "arkusze " + machine.sheets + " · " + Math.round(temp) + " C · grzalka " + machine.heat + "%";
  const entry = hits(230);
  const reg = hits(408) && !blockReg;
  const exit = hits(560);
  const dots = document.querySelectorAll(".dot");
  [entry, reg, exit].forEach((on, i) => dots[i].setAttribute("fill", on ? "#2f7d4a" : "#c8c0b4"));
  if (sheetX == null) sheet.setAttribute("visibility", "hidden");
  else { sheet.setAttribute("visibility", "visible"); sheet.setAttribute("x", sheetX); }
}

function tick() {
  if (machine.clutch && sheetX == null) sheetX = 70;
  if (machine.motor && sheetX != null) sheetX += 4;
  if (sheetX != null && sheetX > 760) sheetX = null;
  if (forceHot) temp = 110;
  else if (machine.heat > 0 && temp < 80) temp = Math.min(80, temp + 0.12);
  else if (!forceHot && temp > 25) temp = Math.max(25, temp - 0.04);
  const entry = hits(230);
  const reg = hits(408) && !blockReg;
  const exit = hits(560);
  machine.step({
    estopOk, coverClosed, sensEntry: entry, sensRegister: reg, sensExit: exit,
    motorFault: false, start: pulse.start, stop: pulse.stop, reset: pulse.reset, temp: temp
  });
  pulse.start = pulse.stop = pulse.reset = false;
  if (!machine.runRequest) blockReg = false;
  paint();
}

document.getElementById("btnEstop").onclick = () => {
  estopOk = !estopOk;
  document.getElementById("btnEstop").textContent = estopOk ? "E-stop" : "E-stop otwarty";
};
document.getElementById("btnCover").onclick = () => {
  coverClosed = !coverClosed;
  document.getElementById("btnCover").textContent = coverClosed ? "Pokrywa" : "Pokrywa otwarta";
};
document.getElementById("btnReset").onclick = () => { pulse.reset = true; };
document.getElementById("btnStart").onclick = () => { blockReg = false; pulse.start = true; };
document.getElementById("btnStop").onclick = () => { pulse.stop = true; };
document.getElementById("btnJam").onclick = () => { blockReg = true; pulse.start = true; };
document.getElementById("btnClear").onclick = () => { sheetX = null; blockReg = false; };
document.getElementById("btnHot").onclick = () => {
  forceHot = !forceHot;
  if (!forceHot) temp = 80;
  document.getElementById("btnHot").textContent = forceHot ? "Za gorąco: tak" : "Za gorąco";
};
paint();
setInterval(tick, 10);
</script>
</body>
</html>
